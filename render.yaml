databases:
  - name: reverse-api-db
    databaseName: reverse_api
    user: reverse_user
    plan: free

services:
  - type: web
    name: ai-api-reverse-engineering
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: reverse-api-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

